[project]
name = "aiep-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sampleless0", email = "Sampleless0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.210",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "matplotlib>=3.11.2",
]

[project.scripts]
aiep-project = "aiep_project:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
